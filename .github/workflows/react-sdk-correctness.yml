# Public release-candidate correctness matrix. Performance is intentionally separate in sdk-acceptance.yml.
name: React SDK correctness

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/react/**'
      - 'packages/opfs-vfs/**'
      - 'packages/plugin-subscriptions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: correctness (${{ matrix.browser }}, React ${{ matrix.react }})
    # The pinned Playwright Linux WebKit build does not expose OPFS.
    runs-on: ${{ matrix.browser == 'webkit' && 'macos-15' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        react: ['19.0.0', '19.3.0']
    env:
      OPFS_VFS_TEST_BROWSER: ${{ matrix.browser }}
      OPFS_VFS_REACT_VERSION: ${{ matrix.react }}
      VITE_OPFS_VFS_REACT_VERSION: ${{ matrix.react }}
      OPFS_VFS_REQUIRE_HTTPS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Install selected React version without rewriting the lockfile
        run: |
          cp packages/react/package.json "$RUNNER_TEMP/react-package.json"
          trap 'cp "$RUNNER_TEMP/react-package.json" packages/react/package.json' EXIT
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const file = "packages/react/package.json";
            const manifest = JSON.parse(readFileSync(file, "utf8"));
            manifest.devDependencies.react = process.env.OPFS_VFS_REACT_VERSION;
            manifest.devDependencies["react-dom"] = process.env.OPFS_VFS_REACT_VERSION;
            writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          '
          pnpm install --lockfile=false
          (
            cd packages/react
            node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            for (const name of ["react", "react-dom"]) {
              const manifest = JSON.parse(readFileSync(`node_modules/${name}/package.json`, "utf8"));
              assert.equal(manifest.version, process.env.OPFS_VFS_REACT_VERSION, `${name} was not selected`);
            }
            '
          )
          rm -rf packages/react/node_modules/.vite
      - name: Install browser
        run: pnpm --filter @opfs-vfs/opfs-vfs exec playwright install --with-deps "$OPFS_VFS_TEST_BROWSER"
      - name: Build public SDK packages
        run: pnpm --filter "@opfs-vfs/react..." build
      - name: Run strict-mode browser and SSR tests
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' -keyout "$RUNNER_TEMP/vitest-key.pem" -out "$RUNNER_TEMP/vitest-cert.pem"
          export VITEST_TLS_KEY="$RUNNER_TEMP/vitest-key.pem"
          export VITEST_TLS_CERT="$RUNNER_TEMP/vitest-cert.pem"
          pnpm --filter @opfs-vfs/react test
      - name: Run SharedWorker transport regression
        if: ${{ matrix.browser == 'webkit' }}
        run: pnpm --filter @opfs-vfs/opfs-vfs exec vitest run src/__tests__/shared-worker-preview.test.ts
      - name: Check packed artifacts and runtime exports
        run: pnpm --filter @opfs-vfs/react test:release-artifact
      - name: Upload packed artifact evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: react-sdk-correctness-${{ matrix.browser }}-react-${{ matrix.react }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/react/.release-artifacts/release-artifacts.json
          if-no-files-found: error
          retention-days: 90
