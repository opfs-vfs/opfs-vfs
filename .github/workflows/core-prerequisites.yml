name: Core prerequisite transport checks

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/opfs-vfs/**'
      - 'packages/plugin-subscriptions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-worker-webkit:
    name: SharedWorker transport (WebKit)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      OPFS_VFS_TEST_BROWSER: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opfs-vfs/opfs-vfs exec playwright install webkit
      - run: pnpm --filter @opfs-vfs/opfs-vfs exec vitest run src/__tests__/shared-worker-preview.test.ts
